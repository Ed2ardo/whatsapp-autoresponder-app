name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Compilar APK Debug
      run: |
        chmod +x ./gradlew || true
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt

    - name: Diagnostico de error si falla
      if: failure()
      run: |
        echo "### Resumen de Error en Compilación" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY || true
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Subir APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: WhatsAppAutoResponder-APK
        path: app/build/outputs/apk/debug/app-debug.apk
